name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-homolog-apply
  cancel-in-progress: false

jobs:
  apply:
    name: Apply database infrastructure
    runs-on: ubuntu-latest
    # Configure required reviewers for this environment in GitHub before the
    # first apply. This repository provisions the homologation RDS instance.
    environment: homolog

    defaults:
      run:
        working-directory: terraform

    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_app_db_password: ${{ secrets.DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Não vem mais pré-instalado no ubuntu-latest (24.04) — necessário pro
      # local-exec de null_resource.app_database (cria o banco GearFlowDb).
      - name: Install sqlcmd
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
          curl -fsSL "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate Terraform configuration
        run: terraform validate -no-color

      - name: Create reviewed execution plan
        run: terraform plan -input=false -no-color -var-file=environments/homolog.tfvars.example -out=tfplan

      - name: Apply execution plan
        run: terraform apply -input=false -no-color tfplan

      - name: Verify RDS and publish deployment summary
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          DB_IDENTIFIER: gearflow-sqlserver-homolog
        run: |
          DB_STATUS=$(aws rds describe-db-instances --db-instance-identifier "$DB_IDENTIFIER" --query 'DBInstances[0].DBInstanceStatus' --output text)
          PUBLIC=$(aws rds describe-db-instances --db-instance-identifier "$DB_IDENTIFIER" --query 'DBInstances[0].PubliclyAccessible' --output text)
          [ "$DB_STATUS" = "available" ]
          [ "$PUBLIC" = "False" ]
          {
            echo "## Deploy do banco concluído"
            echo "- Instância: \`$DB_IDENTIFIER\`"
            echo "- Status: \`$DB_STATUS\`"
            echo "- Acesso público: \`$PUBLIC\`"
            echo "- Região: \`${AWS_REGION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
