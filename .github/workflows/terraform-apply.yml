name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-homolog-apply
  cancel-in-progress: false

jobs:
  ensure-private-runner:
    name: Ensure private database runner
    runs-on: ubuntu-latest
    environment: homolog

    defaults:
      run:
        working-directory: terraform

    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_enable_sql_bootstrap: false
      TF_VAR_runner_repository_url: ${{ github.server_url }}/${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Create one-time runner registration token
        id: runner-token
        env:
          GH_TOKEN: ${{ secrets.GH_RUNNER_ADMIN_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test -n "$GH_TOKEN"
          TOKEN=$(curl --fail-with-body --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/runners/registration-token" | jq --raw-output '.token')
          test -n "$TOKEN"
          test "$TOKEN" != "null"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Ensure VPC, RDS, and private runner
        env:
          TF_VAR_runner_registration_token: ${{ steps.runner-token.outputs.token }}
        run: |
          terraform init -input=false
          terraform validate -no-color
          terraform apply -input=false -auto-approve -var-file=environments/homolog.tfvars.example -target=aws_instance.database_provisioner

  apply:
    name: Apply database infrastructure
    needs: ensure-private-runner
    # Runner Linux privado, registrado na VPC do banco.
    runs-on: [self-hosted, linux, database-vpc]
    # Configure required reviewers for this environment in GitHub before the
    # first apply. This repository provisions the homologation RDS instance.
    environment: homolog

    defaults:
      run:
        working-directory: terraform

    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_app_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_enable_sql_bootstrap: true

    steps:
      - uses: actions/checkout@v4

      - name: Verify private runner prerequisites
        run: |
          command -v sqlcmd
          command -v aws

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate Terraform configuration
        run: terraform validate -no-color

      - name: Create reviewed execution plan
        run: terraform plan -input=false -no-color -var-file=environments/homolog.tfvars.example -out=tfplan

      - name: Apply execution plan
        run: terraform apply -input=false -no-color tfplan

      - name: Verify RDS and publish deployment summary
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          DB_IDENTIFIER: gearflow-sqlserver-homolog
        run: |
          DB_STATUS=$(aws rds describe-db-instances --db-instance-identifier "$DB_IDENTIFIER" --query 'DBInstances[0].DBInstanceStatus' --output text)
          PUBLIC=$(aws rds describe-db-instances --db-instance-identifier "$DB_IDENTIFIER" --query 'DBInstances[0].PubliclyAccessible' --output text)
          [ "$DB_STATUS" = "available" ]
          [ "$PUBLIC" = "False" ]
          {
            echo "## Deploy do banco concluído"
            echo "- Instância: \`$DB_IDENTIFIER\`"
            echo "- Status: \`$DB_STATUS\`"
            echo "- Acesso público: \`$PUBLIC\`"
            echo "- Região: \`${AWS_REGION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
